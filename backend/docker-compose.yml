version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wms_postgres
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_secure_password_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
